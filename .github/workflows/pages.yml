# Build the Trunk WASM app and deploy to GitHub Pages.
# Site URL: https://dshipman.github.io/turing_drawing/
#
# Requires a repo secret ATELIER_CHECKOUT_TOKEN: a fine-grained (or classic)
# PAT with read access to the private dshipman/atelier submodule.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require atelier checkout token
        env:
          TOKEN: ${{ secrets.ATELIER_CHECKOUT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add repo secret ATELIER_CHECKOUT_TOKEN (PAT with read access to dshipman/atelier and this repo)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ATELIER_CHECKOUT_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Compute Trunk public URL
        id: trunk
        shell: bash
        run: |
          base_path="${{ steps.pages.outputs.base_path }}"
          if [ "$base_path" = "/" ] || [ -z "$base_path" ]; then
            public_url="/"
          else
            # Trunk wants a trailing slash (e.g. /turing_drawing/).
            public_url="${base_path%/}/"
          fi
          echo "public_url=${public_url}" >> "$GITHUB_OUTPUT"
          echo "Using public-url=${public_url}"

      - name: Build WASM site
        run: trunk build --release --public-url "${{ steps.trunk.outputs.public_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
