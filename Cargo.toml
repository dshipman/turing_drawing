[package]
name = "turing_drawing"
version = "0.1.0"
edition = "2021"
description = "Local Rust + iced port of Turing Drawings"
license = "BSD-3-Clause"
readme = "README.md"

[dependencies]
dirs = "6"
iced = { version = "0.14", features = ["advanced", "canvas", "image-without-codecs", "tokio"] }
iced_color_wheel = "0.1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
