[package]
name = "turing_drawing"
version = "0.1.0"
edition = "2021"
description = "Local Rust + iced port of Turing Drawings"
license = "BSD-3-Clause"
readme = "README.md"

[dependencies]
iced_color_wheel = "0.1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# native-fs: user theme directory. thread-pool: iced executor Atelier used to enable unconditionally.
# theme-editor: HSV wheel in the appearance colour picker (now behind a feature).
atelier-ui = { path = "external/atelier/crates/atelier-ui", default-features = false, features = ["native-fs", "thread-pool", "theme-editor"] }
dirs = "6"
iced = { version = "0.14", features = ["advanced", "canvas", "image-without-codecs", "tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
atelier-ui = { path = "external/atelier/crates/atelier-ui", default-features = false, features = ["theme-editor"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
iced = { version = "0.14", features = ["advanced", "canvas", "image-without-codecs", "webgl", "fira-sans"] }
web-sys = { version = "0.3", features = ["Window", "Storage", "Location"] }

[profile.release]
lto = true
codegen-units = 1
