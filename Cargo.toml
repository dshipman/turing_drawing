[package]
name = "turing_drawing"
version = "0.1.0"
edition = "2021"
description = "Local Rust + iced port of Turing Drawings"
license = "BSD-3-Clause"
readme = "README.md"

[dependencies]
atelier-ui = { path = "external/atelier/crates/atelier-ui", default-features = false }
iced_color_wheel = "0.1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
iced = { version = "0.14", features = ["advanced", "canvas", "image-without-codecs", "tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
iced = { version = "0.14", features = ["advanced", "canvas", "image-without-codecs", "webgl", "fira-sans"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Location",
    "Navigator",
    "Clipboard",
    "ClipboardEvent",
    "DataTransfer",
    "Document",
    "HtmlDocument",
    "Element",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "HtmlElement",
    "HtmlTextAreaElement",
    "Node",
    "CssStyleDeclaration",
] }

[profile.release]
lto = "thin"
codegen-units = 16
